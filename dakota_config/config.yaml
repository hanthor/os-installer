%YAML 1.2
---
# OS-Installer configuration for Dakota (projectbluefin/dakota) live media.
#
# Experimental: the GNOME OS-style install path shared with Utah. The live
# session boots the shipped bootc disk image from its "Dakota Live" entry
# (`ro dakota.live` plus a live-only initrd on the ESP whose bootc setup-root
# config makes /, /etc and /var tmpfs overlays), and scripts/install.sh, the
# same script as utah_config's, block-copies that image to the chosen disk
# with systemd-repart and fixes up its identity. No `bootc install` runs at
# install time; bootc keeps handling updates afterwards.
#
# Install to /usr/share/dakota/os-installer/ on the live medium, with
# scripts/ dereferenced (it links to utah_config/scripts).

distribution_name: 'Dakota'

# Only an install phase: the image is complete, so there is nothing to
# configure from the installer. gnome-initial-setup creates the user and sets
# region/time zone on first boot.
scripts:
  install: scripts/install.sh

# Offline install: the payload is the medium itself.
internet:
  connection_required: no

welcome_page:
  logo    : 'dakotaraptor.png'
  text    : 'Install Dakota by copying this live system onto a disk. Your account is created on first boot.'
  usage   : yes

# Whole disks only: the copied partition table replaces the target's. The
# minimum covers the medium's 2 GiB ESP and root plus room to grow.
disk:
  partition_ok: no
  min_size: 32

# LUKS2 on the root partition (systemd-repart Encrypt=key-file), unlocked by
# passphrase in Plymouth. TPM2 enrollment is an open decision (Utah #1405),
# so it is not offered yet.
disk_encryption:
  offered: yes
  forced: no
  generated: no
  min_length: 8
  confirmation: yes

skip_region: yes
skip_user: yes

failure_help_url: 'https://github.com/projectbluefin/dakota/issues?q="os-installer {}"'

commands:
  browser: 'xdg-open'
  disks  : 'gnome-disks'
  reboot : 'systemctl reboot'
  wifi   : 'gnome-control-center wifi'
